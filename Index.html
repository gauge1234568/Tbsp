<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Battle Singleplayer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            padding: 20px;
        }
        .screen {
            max-width: 900px;
            margin: auto;
        }
        h1 {
            font-size: 55px;
        }
        h2 {
            font-size: 40px;
        }
        h3 {
            margin-top: 20px;
        }
        .instructions {
            margin: 40px 0 25px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        button {
            font-size: 17px;
            padding: 14px 20px;
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 8px;
            background: white;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .selected {
            border: 4px solid black;
            background: #ddd;
        }
        #selection {
            margin-top: 25px;
            font-size: 20px;
        }
        #startBattle {
            margin-top: 25px;
            font-size: 23px;
            padding: 15px 35px;
        }
        #battleScreen {
            display: none;
        }
        .battle-header {
            margin-bottom: 20px;
        }
        .fighters {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 25px;
        }
        .fighter {
            background: white;
            border: 3px solid #333;
            border-radius: 12px;
            padding: 20px;
        }
        .fighter h3 {
            margin: 0 0 15px;
            font-size: 25px;
        }
        .fighter-label {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .stat {
            margin: 10px 0;
            text-align: left;
        }
        .bar {
            width: 100%;
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 4px;
        }
        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.25s;
        }
        .hp-fill {
            background: #e53935;
        }
        .stamina-fill {
            background: #43a047;
        }
        .energy-fill {
            background: #fbc02d;
        }
        .action-area {
            margin-top: 25px;
            background: white;
            border: 3px solid #333;
            border-radius: 12px;
            padding: 20px;
        }
        .action-area h3 {
            margin-top: 0;
            margin-bottom: 15px;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .move-button {
            min-width: 150px;
        }
        #specialButton {
            background: #ffd54f;
            min-width: 180px;
        }
        .switch-menu {
            margin-top: 15px;
            display: none;
        }
        .switch-menu button {
            margin: 5px;
        }
        #turnText {
            font-size: 24px;
            font-weight: bold;
            margin: 15px;
        }
        .log {
            margin-top: 20px;
            background: #111;
            color: white;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            height: 180px;
            overflow-y: auto;
        }
        .log p {
            margin-bottom: 7px;
        }
        #result {
            margin-top: 25px;
            font-size: 35px;
            font-weight: bold;
        }
        #restartButton {
            margin-top: 20px;
            font-size: 20px;
            display: none;
        }
        @media (max-width: 650px) {
            h1 {
                font-size: 42px;
            }
            h2 {
                font-size: 32px;
            }
            .fighters {
                grid-template-columns: 1fr;
            }
            .fighter {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
<div id="teamScreen" class="screen">
    <h1>TEACHER</h1>
    <h2>BATTLE</h2>
    <h3>SINGLEPLAYER MODE</h3>
    <div class="instructions">
        <p>Choose your battle team</p>
        <p>Choose 3 characters</p>
    </div>
    <div class="buttons">
        <button type="button" onclick="selectCharacter('Mr. Sannes', this)">
            Mr. Sannes
        </button>
        <button type="button" onclick="selectCharacter('Mr. Dutlinger', this)">
            Mr. Dutlinger
        </button>
        <button type="button" onclick="selectCharacter('Dr. Savic', this)">
            Dr. Savic
        </button>
        <button type="button" onclick="selectCharacter('Mr. Smauley', this)">
            Mr. Smauley
        </button>
        <button type="button" onclick="selectCharacter('Mrs. Smauley', this)">
            Mrs. Smauley
        </button>
        <button type="button" onclick="selectCharacter('Mrs. Aysien', this)">
            Mrs. Aysien
        </button>
    </div>
    <div id="selection">
        Characters selected: 0/3
    </div>
    <button
        id="startBattle"
        type="button"
        onclick="startBattle()">
        Start Battle
    </button>
</div>
<div id="battleScreen" class="screen">
    <div class="battle-header">
        <h1>TEACHER BATTLE</h1>
        <div id="turnText">
            Your turn
        </div>
    </div>
    <div class="fighters">
        <div class="fighter">
            <div class="fighter-label">
                You
            </div>
            <h3 id="playerName">
                Mr. Sannes
            </h3>
            <div class="stat">
                HP:
                <span id="playerHPText">
                    0/0
                </span>
                <div class="bar">
                    <div
                        id="playerHPBar"
                        class="bar-fill hp-fill">
                    </div>
                </div>
            </div>
            <div class="stat">
                Stamina:
                <span id="playerStaminaText">
                    0/0
                </span>
                <div class="bar">
                    <div
                        id="playerStaminaBar"
                        class="bar-fill stamina-fill">
                    </div>
                </div>
            </div>
            <div class="stat">
                Energy:
                <span id="playerEnergyText">
                    0/100
                </span>
                <div class="bar">
                    <div
                        id="playerEnergyBar"
                        class="bar-fill energy-fill">
                    </div>
                </div>
            </div>
        </div>
        <div class="fighter">
            <div class="fighter-label">
                CPU
            </div>
            <h3 id="enemyName">
                Mrs. Aysien
            </h3>
            <div class="stat">
                HP:
                <span id="enemyHPText">
                    0/0
                </span>
                <div class="bar">
                    <div
                        id="enemyHPBar"
                        class="bar-fill hp-fill">
                    </div>
                </div>
            </div>
            <div class="stat">
                Stamina:
                <span id="enemyStaminaText">
                    0/0
                </span>
                <div class="bar">
                    <div
                        id="enemyStaminaBar"
                        class="bar-fill stamina-fill">
                    </div>
                </div>
            </div>
            <div class="stat">
                Energy:
                <span id="enemyEnergyText">
                    0/100
                </span>
                <div class="bar">
                    <div
                        id="enemyEnergyBar"
                        class="bar-fill energy-fill">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="action-area">
        <h3>Your Moves</h3>
        <div
            id="moveButtons"
            class="action-buttons">
        </div>
        <div
            class="action-buttons"
            style="margin-top: 10px;">
            <button
                id="specialButton"
                type="button"
                onclick="useSpecial()">
                SPECIAL
            </button>
            <button
                type="button"
                onclick="toggleSwitchMenu()">
                SWITCH
            </button>
        </div>
        <div
            id="switchMenu"
            class="switch-menu">
        </div>
    </div>
    <div
        class="log"
        id="battleLog">
        <p>
            Battle started!
        </p>
    </div>
    <div id="result"></div>
    <button
        id="restartButton"
        type="button"
        onclick="location.reload()">
        Play Again
    </button>
</div>
<script>
const characters = {
    "Mr. Sannes": {
        maxHP: 120,
        maxStamina: 100,
        energyGain: 15,
        moves: [
            {
                name: "VOICECRACK",
                damage: 20,
                staminaCost: 10,
                staminaRecovery: 15,
                energyGain: 15
            },
            {
                name: "3210",
                damage: 30,
                staminaCost: 20,
                energyGain: 20,
                minStaminaPercent: 40
            },
            {
                name: "4 QUARTERS",
                damage: 45,
                staminaCost: 35,
                energyGain: 25,
                minStaminaPercent: 70,
                minHealthPercent: 50
            }
        ],
        special: "GOLDEN SANNES"
    },
    "Mr. Dutlinger": {
        maxHP: 150,
        maxStamina: 200,
        energyGain: 10,
        moves: [
            {
                name: "MARINE BOOTCAMP",
                damage: 25,
                staminaCost: 10,
                energyGain: 10
            },
            {
                name: "HOO-RAH",
                damage: 35,
                staminaCost: 20,
                staminaRecovery: 15,
                energyGain: 15,
                minStaminaPercent: 40
            },
            {
                name: "MTN DEW CHUCK",
                damage: 20,
                staminaCost: 35,
                energyGain: 25,
                minStaminaPercent: 70,
                minHealthPercent: 40
            }
        ],
        special: "50 CAL. TURRET"
    },
    "Dr. Savic": {
        maxHP: 100,
        maxStamina: 100,
        energyGain: 15,
        moves: [
            {
                name: "GUITAR SMASH",
                damage: 20,
                staminaCost: 10,
                energyGain: 15
            },
            {
                name: "MUSIC NOTES",
                damage: 30,
                staminaCost: 20,
                staminaRecovery: 25,
                energyGain: 20,
                minStaminaPercent: 40
            },
            {
                name: "MUSIC LISTENING DAY",
                damage: 45,
                staminaCost: 35,
                energyGain: 25
            }
        ],
        special: "MUSIC LISTENING TEST"
    },
    "Mr. Smauley": {
        maxHP: 100,
        maxStamina: 100,
        energyGain: 15,
        moves: [
            {
                name: "MAP DAY",
                damage: 20,
                staminaCost: 10,
                staminaRecovery: 15,
                energyGain: 15
            },
            {
                name: "AUGUSTUS' CHARM",
                damage: 30,
                staminaCost: 20,
                energyGain: 20,
                minStaminaPercent: 40
            },
            {
                name: "BACKSTAB",
                damage: 45,
                staminaCost: 35,
                energyGain: 25,
                maxHealthPercent: 60
            }
        ],
        special: "BACKUP"
    },
    "Mrs. Smauley": {
        maxHP: 100,
        maxStamina: 100,
        energyGain: 15,
        moves: [
            {
                name: "RULER SMACK",
                damage: 20,
                staminaCost: 10,
                energyGain: 15
            },
            {
                name: "BOOK MINIGUN",
                damage: 40,
                staminaCost: 30,
                staminaRecovery: 25,
                energyGain: 25,
                minStaminaPercent: 60
            }
        ],
        special: "LITERATURE BOOKS"
    },
    "Mrs. Aysien": {
        maxHP: 100,
        maxStamina: 100,
        energyGain: 15,
        moves: [
            {
                name: "BURNING OF THE WHITE HOUSE",
                damage: 20,
                staminaCost: 10,
                energyGain: 15
            },
            {
                name: "GUERILLA WARFARE",
                damage: 30,
                staminaCost: 20,
                energyGain: 20,
                minStaminaPercent: 40
            },
            {
                name: "WASHINGTON'S SPEECH",
                damage: 45,
                staminaCost: 35,
                energyGain: 25,
                minStaminaPercent: 70,
                minHealthPercent: 50
            }
        ],
        special: "PENCIL STAB"
    }
};
let selectedCharacters = [];
let playerTeam = [];
let enemyTeam = [];
let playerActive = 0;
let enemyActive = 0;
let playerTurn = true;
let battleOver = false;
let cpuTimer = null;
function selectCharacter(name, button) {
    if (selectedCharacters.length >= 3) {
        return;
    }
    if (selectedCharacters.includes(name)) {
        return;
    }
    selectedCharacters.push(name);
    button.classList.add("selected");
    document.getElementById("selection").textContent =
        "Characters selected: " +
        selectedCharacters.length +
        "/3";
}
function createCharacter(name) {
    const data = characters[name];
    return {
        name: name,
        maxHP: data.maxHP,
        hp: data.maxHP,
        maxStamina: data.maxStamina,
        stamina: data.maxStamina,
        energy: 0,
        energyGain: data.energyGain,
        moves: data.moves,
        special: data.special,
        defeated: false
    };
}
function startBattle() {
    if (selectedCharacters.length !== 3) {
        alert("Choose 3 characters first!");
        return;
    }
    playerTeam =
        selectedCharacters.map(createCharacter);
    const allNames =
        Object.keys(characters);
    const shuffled =
        [...allNames].sort(
            () => Math.random() - 0.5
        );
    enemyTeam = [];
    for (const name of shuffled) {
        if (!selectedCharacters.includes(name)) {
            enemyTeam.push(
                createCharacter(name)
            );
        }
        if (enemyTeam.length === 3) {
            break;
        }
    }
    while (enemyTeam.length < 3) {
        const randomName =
            allNames[
                Math.floor(
                    Math.random() *
                    allNames.length
                )
            ];
        enemyTeam.push(
            createCharacter(randomName)
        );
    }
    playerActive = 0;
    enemyActive = 0;
    playerTurn = true;
    battleOver = false;
    document.getElementById("teamScreen").style.display =
        "none";
    document.getElementById("battleScreen").style.display =
        "block";
    document.getElementById("result").textContent =
        "";
    document.getElementById("restartButton").style.display =
        "none";
    addLog(
        "Your team: " +
        playerTeam.map(c => c.name).join(", ")
    );
    addLog(
        "CPU team: " +
        enemyTeam.map(c => c.name).join(", ")
    );
    addLog(
        "You send out " +
        playerTeam[playerActive].name +
        "!"
    );
    addLog(
        "CPU sends out " +
        enemyTeam[enemyActive].name +
        "!"
    );
    updateBattleScreen();
    showPlayerTurn();
}
function getPercent(value, max) {
    if (max <= 0) {
        return 0;
    }
    return Math.max(
        0,
        Math.min(
            100,
            (value / max) * 100
        )
    );
}
function updateBattleScreen() {
    if (
        playerTeam.length === 0 ||
        enemyTeam.length === 0
    ) {
        return;
    }
    const player =
        playerTeam[playerActive];
    const enemy =
        enemyTeam[enemyActive];
    document.getElementById("playerName").textContent =
        player.name;
    document.getElementById("enemyName").textContent =
        enemy.name;
    document.getElementById("playerHPText").textContent =
        player.hp +
        "/" +
        player.maxHP;
    document.getElementById("playerHPBar").style.width =
        getPercent(
            player.hp,
            player.maxHP
        ) +
        "%";
    document.getElementById("playerStaminaText").textContent =
        player.stamina +
        "/" +
        player.maxStamina;
    document.getElementById("playerStaminaBar").style.width =
        getPercent(
            player.stamina,
            player.maxStamina
        ) +
        "%";
    document.getElementById("playerEnergyText").textContent =
        player.energy +
        "/100";
    document.getElementById("playerEnergyBar").style.width =
        player.energy +
        "%";
    document.getElementById("enemyHPText").textContent =
        enemy.hp +
        "/" +
        enemy.maxHP;
    document.getElementById("enemyHPBar").style.width =
        getPercent(
            enemy.hp,
            enemy.maxHP
        ) +
        "%";
    document.getElementById("enemyStaminaText").textContent =
        enemy.stamina +
        "/" +
        enemy.maxStamina;
    document.getElementById("enemyStaminaBar").style.width =
        getPercent(
            enemy.stamina,
            enemy.maxStamina
        ) +
        "%";
    document.getElementById("enemyEnergyText").textContent =
        enemy.energy +
        "/100";
    document.getElementById("enemyEnergyBar").style.width =
        enemy.energy +
        "%";
    createMoveButtons();
    createSwitchButtons();
    // SPECIAL BUTTON USES THE ACTIVE CHARACTER'S SPECIAL MOVE
    const specialButton =
        document.getElementById("specialButton");
    specialButton.textContent =
        player.special;
    specialButton.disabled =
        !playerTurn ||
        battleOver ||
        player.energy < 100;
}
function createMoveButtons() {
    const container =
        document.getElementById("moveButtons");
    container.innerHTML = "";
    const player =
        playerTeam[playerActive];
    player.moves.forEach(move => {
        const button =
            document.createElement("button");
        button.type = "button";
        button.className =
            "move-button";
        button.textContent =
            move.name;
        button.disabled =
            !playerTurn ||
            battleOver ||
            player.stamina < move.staminaCost;
        button.onclick = function () {
            useMove(move);
        };
        container.appendChild(button);
    });
}
function useMove(move) {
    if (
        battleOver ||
        !playerTurn
    ) {
        return;
    }
    const player =
        playerTeam[playerActive];
    const enemy =
        enemyTeam[enemyActive];
    if (
        player.stamina <
        move.staminaCost
    ) {
        return;
    }
    playerTurn = false;
    updateBattleScreen();
    enemy.hp -= move.damage;
    if (enemy.hp < 0) {
        enemy.hp = 0;
    }
    player.stamina -=
        move.staminaCost;
    if (player.stamina < 0) {
        player.stamina = 0;
    }
    if (move.staminaRecovery) {
        player.stamina +=
            move.staminaRecovery;
        if (
            player.stamina >
            player.maxStamina
        ) {
            player.stamina =
                player.maxStamina;
        }
        addLog(
            player.name +
            " recovered " +
            move.staminaRecovery +
            " stamina."
        );
    }
    player.energy +=
        move.energyGain ||
        player.energyGain;
    if (player.energy > 100) {
        player.energy = 100;
    }
    addLog(
        player.name +
        " used " +
        move.name +
        "!"
    );
    addLog(
        enemy.name +
        " took " +
        move.damage +
        " damage."
    );
    updateBattleScreen();
    if (enemy.hp <= 0) {
        enemyDefeated();
        return;
    }
    if (player.stamina <= 0) {
        playerDefeated();
        return;
    }
    beginCPUTurn();
}
function useSpecial() {
    if (
        battleOver ||
        !playerTurn
    ) {
        return;
    }
    const player =
        playerTeam[playerActive];
    const enemy =
        enemyTeam[enemyActive];
    if (player.energy < 100) {
        return;
    }
    playerTurn = false;
    player.energy = 0;
    const specialDamage = 50;
    enemy.hp -= specialDamage;
    if (enemy.hp < 0) {
        enemy.hp = 0;
    }
    addLog(
        player.name +
        " used " +
        player.special +
        "!"
    );
    addLog(
        enemy.name +
        " took " +
        specialDamage +
        " damage."
    );
    updateBattleScreen();
    if (enemy.hp <= 0) {
        enemyDefeated();
        return;
    }
    beginCPUTurn();
}
function toggleSwitchMenu() {
    if (
        battleOver ||
        !playerTurn
    ) {
        return;
    }
    const menu =
        document.getElementById("switchMenu");
    if (
        menu.style.display === "block"
    ) {
        menu.style.display =
            "none";
    } else {
        menu.style.display =
            "block";
    }
}
function createSwitchButtons() {
    const menu =
        document.getElementById("switchMenu");
    menu.innerHTML = "";
    playerTeam.forEach(
        (character, index) => {
            const button =
                document.createElement("button");
            button.type = "button";
            button.textContent =
                "Switch to " +
                character.name;
            button.disabled =
                index === playerActive ||
                character.hp <= 0 ||
                character.stamina <= 0 ||
                !playerTurn ||
                battleOver;
            button.onclick = function () {
                switchPlayer(index);
            };
            menu.appendChild(button);
        }
    );
}
function switchPlayer(index) {
    if (
        battleOver ||
        !playerTurn
    ) {
        return;
    }
    if (index === playerActive) {
        return;
    }
    const newCharacter =
        playerTeam[index];
    if (
        newCharacter.hp <= 0 ||
        newCharacter.stamina <= 0
    ) {
        return;
    }
    playerTurn = false;
    playerActive = index;
    document.getElementById("switchMenu").style.display =
        "none";
    addLog(
        "You switched to " +
        newCharacter.name +
        "!"
    );
    updateBattleScreen();
    beginCPUTurn();
}
function beginCPUTurn() {
    if (battleOver) {
        return;
    }
    playerTurn = false;
    document.getElementById("turnText").textContent =
        "CPU's turn";
    updateBattleScreen();
    if (cpuTimer !== null) {
        clearTimeout(cpuTimer);
    }
    cpuTimer =
        setTimeout(
            function () {
                cpuTimer = null;
                if (!battleOver) {
                    aiTurn();
                }
            },
            500
        );
}
function canAIUseMove(enemy, move) {
    const staminaPercent =
        getPercent(
            enemy.stamina,
            enemy.maxStamina
        );
    const healthPercent =
        getPercent(
            enemy.hp,
            enemy.maxHP
        );
    if (
        enemy.stamina <
        move.staminaCost
    ) {
        return false;
    }
    if (
        move.minStaminaPercent !== undefined &&
        staminaPercent <
        move.minStaminaPercent
    ) {
        return false;
    }
    if (
        move.maxStaminaPercent !== undefined &&
        staminaPercent >
        move.maxStaminaPercent
    ) {
        return false;
    }
    if (
        move.minHealthPercent !== undefined &&
        healthPercent <
        move.minHealthPercent
    ) {
        return false;
    }
    if (
        move.maxHealthPercent !== undefined &&
        healthPercent >
        move.maxHealthPercent
    ) {
        return false;
    }
    return true;
}
function chooseAIMove(enemy) {
    const availableMoves =
        enemy.moves.filter(
            function (move) {
                return canAIUseMove(
                    enemy,
                    move
                );
            }
        );
    if (
        availableMoves.length === 0
    ) {
        return null;
    }
    const sortedMoves =
        [...availableMoves].sort(
            function (a, b) {
                return b.damage - a.damage;
            }
        );
    if (
        sortedMoves.length > 1 &&
        Math.random() < 0.25
    ) {
        return sortedMoves[
            Math.floor(
                Math.random() *
                sortedMoves.length
            )
        ];
    }
    return sortedMoves[0];
}
function aiTurn() {
    if (battleOver) {
        return;
    }
    const enemy =
        enemyTeam[enemyActive];
    const player =
        playerTeam[playerActive];
    if (!enemy || !player) {
        return;
    }
    if (enemy.energy >= 100) {
        enemy.energy = 0;
        const specialDamage = 50;
        player.hp -=
            specialDamage;
        if (player.hp < 0) {
            player.hp = 0;
        }
        addLog(
            enemy.name +
            " used " +
            enemy.special +
            "!"
        );
        addLog(
            player.name +
            " took " +
            specialDamage +
            " damage."
        );
    } else {
        const move =
            chooseAIMove(enemy);
        if (!move) {
            const staminaRecovery = 20;
            enemy.stamina +=
                staminaRecovery;
            if (
                enemy.stamina >
                enemy.maxStamina
            ) {
                enemy.stamina =
                    enemy.maxStamina;
            }
            addLog(
                enemy.name +
                " recovered " +
                staminaRecovery +
                " stamina."
            );
        } else {
            player.hp -=
                move.damage;
            if (player.hp < 0) {
                player.hp = 0;
            }
            enemy.stamina -=
                move.staminaCost;
            if (enemy.stamina < 0) {
                enemy.stamina = 0;
            }
            if (move.staminaRecovery) {
                enemy.stamina +=
                    move.staminaRecovery;
                if (
                    enemy.stamina >
                    enemy.maxStamina
                ) {
                    enemy.stamina =
                        enemy.maxStamina;
                }
                addLog(
                    enemy.name +
                    " recovered " +
                    move.staminaRecovery +
                    " stamina."
                );
            }
            enemy.energy +=
                move.energyGain ||
                enemy.energyGain;
            if (enemy.energy > 100) {
                enemy.energy = 100;
            }
            addLog(
                enemy.name +
                " used " +
                move.name +
                "!"
            );
            addLog(
                player.name +
                " took " +
                move.damage +
                " damage."
            );
        }
    }
    updateBattleScreen();
    if (player.hp <= 0) {
        playerDefeated();
        return;
    }
    if (enemy.stamina <= 0) {
        enemyDefeated();
        return;
    }
    showPlayerTurn();
}
function enemyDefeated() {
    const enemy =
        enemyTeam[enemyActive];
    enemy.hp = 0;
    enemy.defeated = true;
    addLog(
        enemy.name +
        " was defeated!"
    );
    const nextEnemy =
        enemyTeam.findIndex(
            function (character) {
                return (
                    !character.defeated &&
                    character.hp > 0 &&
                    character.stamina > 0
                );
            }
        );
    if (nextEnemy === -1) {
        winBattle();
        return;
    }
    enemyActive =
        nextEnemy;
    addLog(
        "CPU sends out " +
        enemyTeam[enemyActive].name +
        "!"
    );
    playerTurn = true;
    updateBattleScreen();
    showPlayerTurn();
}
function playerDefeated() {
    const player =
        playerTeam[playerActive];
    player.hp = 0;
    player.defeated = true;
    addLog(
        player.name +
        " was defeated!"
    );
    const nextPlayer =
        playerTeam.findIndex(
            function (character) {
                return (
                    !character.defeated &&
                    character.hp > 0 &&
                    character.stamina > 0
                );
            }
        );
    if (nextPlayer === -1) {
        loseBattle();
        return;
    }
    playerActive =
        nextPlayer;
    addLog(
        "You send out " +
        playerTeam[playerActive].name +
        "!"
    );
    playerTurn = true;
    updateBattleScreen();
    showPlayerTurn();
}
function showPlayerTurn() {
    if (battleOver) {
        return;
    }
    playerTurn = true;
    document.getElementById("turnText").textContent =
        "Your turn";
    updateBattleScreen();
}
function addLog(message) {
    const log =
        document.getElementById("battleLog");
    const entry =
        document.createElement("p");
    entry.textContent =
        message;
    log.appendChild(entry);
    log.scrollTop =
        log.scrollHeight;
}
function winBattle() {
    battleOver = true;
    playerTurn = false;
    if (cpuTimer !== null) {
        clearTimeout(cpuTimer);
        cpuTimer = null;
    }
    document.getElementById("turnText").textContent =
        "BATTLE COMPLETE";
    document.getElementById("result").textContent =
        "YOU WIN!";
    document.getElementById("restartButton").style.display =
        "inline-block";
    updateBattleScreen();
    addLog(
        "You defeated the entire CPU team!"
    );
}
function loseBattle() {
    battleOver = true;
    playerTurn = false;
    if (cpuTimer !== null) {
        clearTimeout(cpuTimer);
        cpuTimer = null;
    }
    document.getElementById("turnText").textContent =
        "BATTLE COMPLETE";
    document.getElementById("result").textContent =
        "YOU LOSE!";
    document.getElementById("restartButton").style.display =
        "inline-block";
    updateBattleScreen();
    addLog(
        "The CPU defeated your battle party."
    );
}
</script>
</body>
